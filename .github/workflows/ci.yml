name: CI/CD Pipeline - Sunrise Dental Clinic

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  # ==============================================================================
  # Job 1: Build, Test & Package WAR Artifact
  # ==============================================================================
  build-and-test:
    name: Maven Build, Unit Test & WAR Packaging
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Set Up JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 3. Verify Build Environment
        run: |
          java -version
          mvn -version

      - name: 4. Execute Automated JUnit 5 & Mockito Tests
        run: mvn clean test

      - name: 5. Package WAR Web Application
        run: mvn package -DskipTests

      - name: 6. Archive Production WAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sunrise-dental-clinic-war
          path: target/sunrise-dental-clinic.war
          retention-days: 14

  # ==============================================================================
  # Job 2: Automated Deployment to Apache Tomcat 10.1 (Optional / Staging)
  # ==============================================================================
  deploy-tomcat:
    name: Deploy to Apache Tomcat Server
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 1. Download Packaged WAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: sunrise-dental-clinic-war
          path: target

      - name: 2. Deploy WAR to Remote Tomcat via Manager API
        # Only runs if Tomcat secrets are provided in GitHub Repository Settings
        if: env.TOMCAT_HOST != '' && env.TOMCAT_USERNAME != ''
        env:
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
          TOMCAT_USERNAME: ${{ secrets.TOMCAT_USERNAME }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
        run: |
          echo "Initiating automated deployment to Tomcat 10.1 Manager..."
          curl --upload-file target/sunrise-dental-clinic.war \
            "http://${TOMCAT_USERNAME}:${TOMCAT_PASSWORD}@${TOMCAT_HOST}/manager/text/deploy?path=/sunrise-dental-clinic&update=true"
          echo "Deployment command sent successfully."
