<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sunrise Dental Clinic Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

    <div class="login-card">
        <div class="login-brand">
            <div class="brand-logo">🦷</div>
            <h2>Sunrise Dental Clinic</h2>
            <p>Staff Portal Authentication</p>
        </div>

        <div id="loginAlert"></div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input type="text" id="username" class="form-control" placeholder="Enter staff username" required autocomplete="username">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter password" required autocomplete="current-password">
            </div>

            <button type="submit" id="btnLoginSubmit" class="btn btn-primary btn-block">
                Secure Sign In
            </button>
        </form>

        <div class="credentials-hint">
            <strong>Demo Credentials (BCrypt Hashed):</strong><br>
            • <strong>Admin:</strong> <code>admin</code> / <code>Admin@123</code><br>
            • <strong>Receptionist:</strong> <code>receptionist</code> / <code>Reception@123</code><br>
            • <strong>Dentist:</strong> <code>dentist</code> / <code>Dentist@123</code>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/validation.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Check if already logged in
            await Auth.redirectIfLoggedIn();

            // Check if redirected due to expiry
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('expired') === 'true') {
                Validation.showAlert('loginAlert', 'Your session has expired. Please log in again.', 'warning');
            }

            const usernameEl = document.getElementById('username');
            const passwordEl = document.getElementById('password');

            // Attach real-time input listeners
            Validation.bindRealtimeValidation('username', Validation.validateUsername.bind(Validation));
            Validation.bindRealtimeValidation('password', Validation.validatePassword.bind(Validation));

            const loginForm = document.getElementById('loginForm');
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                Validation.clearAlert('loginAlert');

                const username = usernameEl.value.trim();
                const password = passwordEl.value;

                let isValid = true;
                const userVal = Validation.validateUsername(username);
                if (!userVal.valid) {
                    Validation.setInvalid(usernameEl, userVal.message);
                    isValid = false;
                } else {
                    Validation.setValid(usernameEl);
                }

                const passVal = Validation.validatePassword(password);
                if (!passVal.valid) {
                    Validation.setInvalid(passwordEl, passVal.message);
                    isValid = false;
                } else {
                    Validation.setValid(passwordEl);
                }

                if (!isValid) {
                    Validation.showAlert('loginAlert', 'Please enter your username and password.', 'danger');
                    return;
                }

                const btn = document.getElementById('btnLoginSubmit');
                btn.disabled = true;
                btn.textContent = 'Authenticating...';

                const response = await Auth.login(username, password);

                btn.disabled = false;
                btn.textContent = 'Secure Sign In';

                if (response.success && response.data) {
                    window.location.href = 'dashboard.html';
                } else {
                    Validation.setInvalid(usernameEl, '');
                    Validation.setInvalid(passwordEl, '');
                    Validation.showAlert('loginAlert', response.message || 'Invalid username or password.', 'danger');
                }
            });
        });
    </script>
</body>
</html>
